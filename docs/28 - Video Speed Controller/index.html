<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Speed Scrubber</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="wrapper">
        <video class="flex" width="765" height="430"
            src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" loop
            controls></video>
        <div class="speed">
            <div class="speed-bar">1×</div>
        </div>
    </div>

    <script>
        const speed = document.querySelector(".speed");
        const speedBar = document.querySelector(".speed-bar");
        const vid = document.querySelector("video");

        let mouseDown = false;

        speed.addEventListener("mousedown", () => mouseDown = true);
        speed.addEventListener("mouseup", () => mouseDown = false);

        function handleMove(e) {
            if (!mouseDown) return;

            const percent = (e.pageY - this.offsetTop) / this.offsetHeight;
            const min = 0.1;
            const max = 5;
            const height = Math.round(percent * 100);
            if (height >= 0.1 && height <= 100) {
                const playbackSpeed = percent * (max - min) + min;
                speedBar.style.height = height + "%";
                speedBar.textContent = playbackSpeed.toFixed(2) + "×";
                vid.playbackRate = playbackSpeed;
            }
        }

        speed.addEventListener("mousemove", handleMove);
    </script>

</body>

</html>
